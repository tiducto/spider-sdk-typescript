name: publish npm

# Publishes @tiducto/spider-sdk-typescript to the public npm registry (registry.npmjs.org)
# using npm Trusted Publishing (OIDC) — no long-lived token. npm provenance is emitted from
# the same OIDC identity (a signed, verifiable link from the tarball back to this workflow run).
#
# The published version is package.json's `version` — npm rejects republishing an existing
# version, so bump it (via version.properties) before cutting a release. Two triggers:
#   - push a semver tag `X.Y.Z`   → the normal release path
#   - workflow_dispatch           → manual re-run from the Actions tab
#
# Auth: OIDC trusted publishing — configure the trusted publisher once on npmjs (see
# RELEASING.md). No NPM_TOKEN secret. Requires npm >= 11.5.1 (installed below).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@tiducto'
      # Trusted publishing needs npm >= 11.5.1; pin latest so it works regardless of the bundled version.
      - run: npm install -g npm@latest
      # `npm run build` runs `prebuild` (rm -rf dist) first, so stale artifacts (e.g. a
      # dropped routes.*) can never ship. `npm publish` re-runs the same clean build via
      # `prepublishOnly`, so the tarball always reflects the current src.
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
